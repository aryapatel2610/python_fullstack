<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration form</title>
</head>

<body>
    <fieldset align="center">
        <legend>Student Registration Form</legend>

        <table align="center" bgcolor="lightblue">

            <form>
                <tr>
                    <td><label for="">Enter your First name </label></td>
                    <td><input required type="text" pattern="[a-zA-Z]" placeholder="Enter your first name " value="" title="name"></td>
                </tr><BR>
                <tr>
                    <td><label for="">Enter your last name </label></td>
                    <td><input required type="text" pattern="[a-zA-Z]" placeholder="Enter your last name " value="" title="name"></td>
                </tr><br>   
                <tr>
                    <td><label for="">Enter your email </label></td>
                    <td><input required type="email" pattern="[a-z]+[@,.]" placeholder="Enter your email " value="" title="email"></td>
                </tr><br>
                <tr>
                    <td><label for="">Enter your Phone number </label></td>
                    <td><input type="tel" placeholder="Enter your phone number " value="" title="phone"></td>
                </tr><br>
                <tr>
                    <td><label for="">Select your gender</label></td>
                    <td><input type="radio" name="gender">Male
                        <input type="radio" name="gender">Female
                        <input type="radio" name="gender">Others
                    </td><br>
                </tr>
                <tr>
                    <td><label for="">Enter your birth date </label></td>
                    <td><input type="date"></td>
                </tr><br>
                <tr>
                    <td align="center"><label for="">Enter your address </label></td>
                    <td>
                        <textarea naem="" name="" rows="10" cols="30" placeholder="Enter your address "
                            id=""></textarea>
                    </td>
                </tr><br>
                <tr>
                    <td><label for="">Enter your city </label></td>
                    <td><input type="text" placeholder="Enter your city " value="" title="city"></td>
                </tr><br>
                <tr>
                    <td><label for="">Enter your PINCODE </label></td>
                    <td><input type="text" placeholder="Enter your PINCODE " value="" title="pincode"></td>
                </tr><br>
                <tr>
                    <td><label for="">Enter your State </label></td>
                    <td><input type="text" placeholder="Enter your State " value="" title="state"></td>
                </tr><br>
                <tr>
                    <td><label for="">Enter your country </label></td>
                    <td><input type="text" placeholder="Enter your country " value="" title="country"></td>
                </tr><br>
                <tr>
                    <td><label for="">Hobbies :- </label></td>
                    <td>
                        <input type="checkbox" name="hobbies" value="reading">Reading
                        <input type="checkbox" name="hobbies" value="singing">singing
                        <input type="checkbox" name="hobbies" value="sports">Sports<br>
                        <input type="checkbox" name="hobbies" value="dancing">dancing
                        <input type="checkbox" name="hobbies" value="sketching">sketching
                        <input type="checkbox" name="hobbies" value="traveling">traveling<br>
                        <input type="text" placeholder="Enter other hobbies " name="other_hobbies">
                    </td>
                </tr><br>
                <tr>
                    <td><label for="">Qualifications:- </label></td>
                    <td>
                        <input type="checkbox" name="qualifications" value="high_school">High school(10th)<br>
                        <input type="checkbox" name="qualifications" value="diploma">Higher school(12th)<br>
                        <input type="checkbox" name="qualifications" value="Graduation">Graduation<br>
                        <input type="checkbox" name="qualifications" value=" post Graduation">post Graduation
                        <input type="checkbox" name="qualifications" value="phd">PhD
                        <input type="checkbox" name="qualifications" value="other">Other<br>
                        <input type="text" placeholder="Enter other qualifications " name="other_qualifications">
                    </td>
                </tr>
                <tr>
                    <td><label for="">course applied for:- </label></td>
                    <td>
                        <input type="checkbox" name="courses" value="computer_science">Computer Science<br>
                        <input type="checkbox" name="courses" value="BCA">BCA<br>
                        <input type="checkbox" name="courses" value="BSC">BSC<br>
                        <input type="checkbox" name="courses" value="BBA">BBA<br>
                        <input type="checkbox" name="courses" value="MCA">MCA<br>
                        <input type="text" placeholder="Enter other courses " name="other_courses">
                    </td>
                </tr>
                <tr>
                    <td align="right">
                        <input type="submit">
                    </td>
                    <td align="left">
                        <input type="reset">
                    </td>


                </tr>



            </form>
        </table>
        </Fildset>


</body>
