<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
    />

    <!-- Demo styles -->
    <style>
     
      .swiper {
        width: 500px;
        height: 500px;
        padding: 50px;
        transform-style: preserve-3d;
      }

      .swiper-slide {
        background-position: center;
        background-size: cover;
        width: 500px;
        height: 500px;
      }
      .img{
        width: 100%;
        height: 100%;   
      }

      .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>

  <body>
    <!-- Swiper -->
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img src="/image/1.jpeg" class="img" />
        </div>
        <div class="swiper-slide">
          <img src="/image/2.jpeg" class="img" />
        </div>
        <div class="swiper-slide">
          <img src="/image/3.jpeg" class="img" />
        </div>
        <div class="swiper-slide">
          <img src="/image/4.jpeg" class="img" />
        </div>
       
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-pagination"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
      var swiper = new Swiper('.mySwiper', {
        effect: 'flip',
        grabCursor: true,
        pagination: {
          el: '.swiper-pagination',
        },
        navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev',
        },
      });
    </script>
  </body>
</html>
