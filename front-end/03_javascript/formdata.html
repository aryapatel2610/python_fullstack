<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <form action="" >
        <div>
            <input type="text" placeholder="Enter your Name" id="nm" onblur="return validation(nm,nmerr)">
            <span id="nmerr"></span>
        </div>
        <div>
            <input type="email" placeholder="Enter your Email" onblur="return validation(em,emerr)" id="em">
            <span id="emerr"></span>
        </div>
        <div>
            <input type="tel" onblur="return validation(ph,pherr)" placeholder="Enter your Phone" id="ph">
            <span id="pherr"></span>
        </div>
        <div>
            <input type="password" onblur="return validation(psw,pswerr)" placeholder="Enter your password" id="psw">
            <span id="pswerr"></span>
        </div>
        <div>
            <input type="submit">
        </div>
    </form>

    <script>

       function validation(inp,err){
         if(inp.value == "" || inp.value == null){
            err.innerHTML = "pls Required ..!"
            err.style.color = "red"
            inp.style.border = "2px solid red"
            return false
         }
         else{
            err.innerHTML = ""
            inp.style.border = "2px solid green"
         }
       }

    </script>

</body>

</html>
