<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        // 1) array inside array

        let arr = [1,2,3,[4,5,6,[7,8,9]]]

        console.log(arr)
        console.log(arr[2])
        console.log(arr[3][1])
        console.log(arr[3][3][2])

        // 2) array inside object 

        let arr1 = [1,2,3,{
            name :"shubham",
            course:"front-end"
        },67,7,9,0]

        console.log(arr1[3].name)

        // 3) object inside object
        
        let person = {
            name :"het",
            course:{
                front:"front-end",
                back:"back-and"
            },
            age:34
        }
        console.log(person.age)

        console.log(person.course.back)

        // 4) object inside array


        let person1 = {
            name :"het",
            course:["front","back","MERN_STACK"],
            age:34
        }

        console.log(person1.course[2])

    </script>
</body>
</html>
