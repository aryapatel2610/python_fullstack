<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Spotify Playlist</title>

    <style>
        .playlist {
            display: flex;
            gap: 15px;
            padding: 20px;
            background-color: #222;
        }

        .song-card {
            display: flex;
            align-items: center;
            width: 180px;
            height: 80px;
            padding: 10px;
            background-color: #333;
            color: white;
            border-radius: 10px;
        }

        .song-card h3 {
            margin: 0;
            font-size: 16px;
        }

        .song-card p {
            margin: 5px 0 0;
            font-size: 13px;
            color: #bbb;
        }
    </style>
</head>
<body>
    <h2 style="color: rgb(13, 170, 58);">My Playlist</h2>

    <div class="playlist">

        <div class="song-card">
            <div>
                <h3>Perfect</h3>
                <p>Ed Sheeran</p>
            </div>
        </div>

        <div class="song-card">
            <div>
                <h3>Believer</h3>
                <p>Imagine Dragons</p>
            </div>
        </div>

        <div class="song-card">
            <div>
                <h3>Shape of You</h3>
                <p>Ed Sheeran</p>
            </div>
        </div>

        <div class="song-card">
            <div>
                <h3>Blinding Lights</h3>
                <p>The Weeknd</p>
            </div>
        </div>

        <div class="song-card">
            <div>
                <h3>Levitating</h3>
                <p>Dua Lipa</p>
            </div>
        </div>

    </div>
</body>
</html>
