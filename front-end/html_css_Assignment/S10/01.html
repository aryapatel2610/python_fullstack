<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .carousel {
        width: 500px;
        margin: auto;
    }

    .carousel-item img {
        height: 350px;
        object-fit: contain;
    }
</style>
</head>

<body>
    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bootstrap Practice Tasks</title>

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>

        <!-- =========================
     1. Spotify Navbar
========================= -->

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">

                <a class="navbar-brand fw-bold" href="#">🎵 MusicPlay</a>

                <!-- Hamburger button -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menu -->
                <div class="collapse navbar-collapse" id="navbarMenu">
                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link active" href="#">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Playlists</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Profile</a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>


        <!-- =========================
     2. Flipkart Product Card
========================= -->

        <div class="container my-5">

            <h2 class="text-center mb-4">Product Preview</h2>

            <div class="card mx-auto" style="width: 18rem;">

                <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">

                <div class="card-body">

                    <h5 class="card-title">Wireless Headphones</h5>

                    <p class="card-text text-success fw-bold">
                        ₹1,499
                    </p>

                    <button class="btn btn-primary w-100">
                        Buy Now
                    </button>

                </div>
            </div>

        </div>


        <!-- =========================
     3. Movie Carousel
========================= -->

        <div class="container my-5">

            <h2 class="text-center mb-4">Featured Movies</h2>

            <div id="movieCarousel" class="carousel slide" data-bs-ride="carousel"  data-bs-interval="2000">

                <!-- Indicators -->
                <div class="carousel-indicators">

                    <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="0" class="active"></button>

                    <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="1"></button>

                    <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="2"></button>

                </div>

                <!-- Carousel Items -->
                <div class="carousel-inner">

                    <div class="carousel-item active">
                        <img src="https://tse2.mm.bing.net/th/id/OIP.3D2HMCW0jRDcPd9zuhjIegHaEK?r=0&pid=Api&P=0&h=180"
                            class="d-block w-100" alt="Movie 1">

                        <div class="carousel-caption d-block">
                            <h5>FIGHTER</h5>
                            <p>Now Showing</p>
                        </div>
                    </div>

                    <div class="carousel-item">
                        <img src="https://tse3.mm.bing.net/th/id/OIP.0hfuDgAzchkf9pHkRqat0gHaKb?r=0&pid=Api&P=0&h=180" class="d-block w-100" alt="Movie 2">

                        <div class="carousel-caption d-block">
                            <h5>JAB WE MET</h5>
                            <p>Book Your Tickets Now</p>
                        </div>
                    </div>

                    <div class="carousel-item">
                        <img src="https://tse4.mm.bing.net/th/id/OIP.Cffy3MOgOJmH2M9A49HVUwHaKu?r=0&pid=Api&P=0&h=180" class="d-block w-100" alt="Movie 3">

                        <div class="carousel-caption d-block">
                            <h5>TAMASHA</h5>
                            <p>Coming Soon</p>
                        </div>
                    </div>

                </div>

                <!-- Previous Button -->
                <button class="carousel-control-prev" type="button" data-bs-target="#movieCarousel"
                    data-bs-slide="prev">

                    <span class="carousel-control-prev-icon"></span>

                </button>

                <!-- Next Button -->
                <button class="carousel-control-next" type="button" data-bs-target="#movieCarousel"
                    data-bs-slide="next">

                    <span class="carousel-control-next-icon"></span>

                </button>

            </div>

        </div>


        <!-- =========================
     4. Zomato Review Form
========================= -->

        <div class="container my-5">

            <div class="card p-4 mx-auto" style="max-width: 600px;">

                <h2 class="text-center mb-4">
                    🍽️ Restaurant Review
                </h2>

                <form>

                    <!-- Name -->
                    <div class="mb-3">

                        <label class="form-label">
                            Your Name
                        </label>

                        <input type="text" class="form-control" placeholder="Enter your name">

                    </div>

                    <!-- Rating -->
                    <div class="mb-3">

                        <label class="form-label">
                            Rating
                        </label>

                        <select class="form-select">

                            <option selected>Select Rating</option>
                            <option>⭐ 1 Star</option>
                            <option>⭐⭐ 2 Stars</option>
                            <option>⭐⭐⭐ 3 Stars</option>
                            <option>⭐⭐⭐⭐ 4 Stars</option>
                            <option>⭐⭐⭐⭐⭐ 5 Stars</option>

                        </select>

                    </div>

                    <!-- Review -->
                    <div class="mb-3">

                        <label class="form-label">
                            Review
                        </label>

                        <textarea class="form-control" rows="4" placeholder="Write your review"></textarea>

                    </div>

                    <button type="submit" class="btn btn-danger w-100">
                        Submit Review
                    </button>

                </form>

            </div>

        </div>


        <!-- =========================
     5. Food Filter Buttons
========================= -->

        <div class="container my-5 text-center">

            <h2 class="mb-4">Food Categories</h2>

            <div class="btn-group" role="group">

                <button type="button" class="btn btn-success active">
                    All
                </button>

                <button type="button" class="btn btn-outline-success">
                    Veg
                </button>

                <button type="button" class="btn btn-outline-danger">
                    Non-Veg
                </button>

                <button type="button" class="btn btn-outline-warning">
                    Desserts
                </button>

            </div>

        </div>


        <!-- Bootstrap JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>

    </html>
</body>

</html>
