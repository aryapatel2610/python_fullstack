<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Food Order Form</h1>
    <form action="/place-order" method="POST"> 
        <label for="order-name">User Name:</label>
         <input
            type="text" id="order-name" name="user_name" placeholder="Enter your name" required> <br><br>
         <label for="food">Food Item:</label> 
         <select id="food" name="food_item" required>
            <option value="" disabled selected>Select a food item</option>
            <option value="pizza">Pizza</option>
            <option value="burger">Burger</option>
            <option value="biryani">Biryani</option>
            <option value="pasta">Pasta</option>
        </select> <br><br> 
         <label for="quantity">Quantity:</label> <input type="number" id="quantity"
            name="quantity" min="1" required> <br><br> 
             <label for="instructions">Delivery Instructions:</label> <br> 
             <textarea id="instructions" name="delivery_instructions" rows="4" cols="40"
            placeholder="Enter delivery instructions" required></textarea> <br><br>
        <label for="order-id">Order ID:</label> 
        <input type="text" id="order-id" name="order_id" value="ORD12345"
            disabled> <br><br> 
            <button type="submit">Place Order</button> </form>
</body>
</html>
