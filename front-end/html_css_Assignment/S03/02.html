<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Product Review</h1>
    <form action="/submit-review" method="POST"> <!-- Username is required --> <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required> <br><br>
        <!-- Rating must be selected --> <label for="rating">Rating:</label> <select id="rating" name="rating" required>
            <!-- This option cannot be selected as a valid value -->
            <option value="" disabled selected>Select your rating</option>
            <option value="1">1 - Very Bad</option>
            <option value="2">2 - Bad</option>
            <option value="3">3 - Average</option>
            <option value="4">4 - Good</option>
            <option value="5">5 - Excellent</option>
        </select> <br><br> <!-- Review must contain at least 20 characters --> <label for="review">Review
            Message:</label> <br> <textarea id="review" name="review" rows="5" cols="40"
            placeholder="Write your review here..." minlength="20" required></textarea> <br><br> <button
            type="submit">Submit Review</button>
    </form>
    <hr>
</body>

</html>
