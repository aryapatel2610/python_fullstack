<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            color: #222;
            transition: 0.3s;
        }

        .navbar {
            background-color: #961ce7;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .movie-card {
            width: 350px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            background-color: #f5f5f5;
        }

        button {
            background-color: #961ce7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #961ce7;
        }

        /* Dark Mode */

        body.dark-mode {
            background-color: #121212;
            color: white;
        }

        body.dark-mode .movie-card {
            background-color: #242424;
        }

        body.dark-mode .navbar {
            background-color: #961ce7;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>🎬 BookMyShow</h1>
         <button onclick="toggleMode()" >
            🌙 Toggle Dark Mode
        </button>
    </div>

    <div class="movie-card">

        <h2>Avengers: Endgame</h2>

        <p>⭐ Rating: 4.8/5</p>

        <p>
            The Avengers assemble one final time
            to save the universe.
        </p>

        <button>Book Tickets</button>

        <br><br>

    </div>

    <script>
        function toggleMode() {
            document.body.classList.toggle("dark-mode");
        }
    </script>
</body>
</html>
