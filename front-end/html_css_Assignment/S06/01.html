<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Notification</title>
    <style>
        body {
            height: 1500px;
            font-family: Arial, sans-serif;
        }

        .whatsapp-badge {
            position: fixed;
            right: 25px;
            bottom: 25px;

            margin: 10px;
            padding: 15px 20px;

            background-color: #25D366;
            color: white;

            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 3px 10px gray;
        }

        .message-box {
            width: fit-content;
            padding: 10px 15px;
            border: 2px solid #0d0d0d;
        }

        .message-box h2,
        .message-box p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
     <h1 style="color: #2abb55;">WhatsApp</h1>

    <div class="message-box">
        <h2 style="font-size: 24px;">Marry</h2>
        <p style="font-size: 20px;">Hey, how are you doing?</p>
    </div>

    <div class="whatsapp-badge">
         WhatsApp Chat
    </div>
</body>
</html>
