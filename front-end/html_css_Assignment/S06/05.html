<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Card</title>

    <style>
        .restaurant-card {
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: Arial, sans-serif;
        }

        .restaurant-name {
            color: #568955;
            padding: 10px;
            border-bottom: 1px solid #eff2f0;
        }

        .cuisine {
            margin: 10px 0;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .address {
            margin: 10px 0;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .rating {
            margin-top: 10px;
            padding: 10px;
            color: rgb(17, 17, 17);
        }
    </style>
</head>
<body>
    <div class="restaurant-card">

        <div class="restaurant-name">
            <h2>Spice Garden</h2>
        </div>

        <div class="cuisine">
            <p> Indian • Chinese • Fast Food</p>
        </div>

        <div class="address">
            <p></p> 123 Flavor Street, Foodie City</p>
        </div>

        <div class="rating">
            <strong>⭐ 4.5 / 5</strong>
        </div>

    </div>

</body>
</html>
