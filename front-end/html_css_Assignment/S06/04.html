<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reusable CSS Class</title>

    <style>
        /*
         Reusable spacing class:
         Instead of writing the same margin and padding
         for multiple elements, we can use one common class.
         This improves maintainability because changing the
         spacing in one place updates every element using it.
        */

        .common-spacing {
            margin: 10px;
            padding: 15px;
        }

        .restaurant-card {
            width: 300px;
            border: 2px solid #ccc;
            margin: 50px auto;
        }

        .restaurant-name {
            border-bottom: 1px solid #ccc;
        }

        .cuisine {
            border-bottom: 1px solid #ccc;
        }

        .rating {
            color: green;
        }
    </style>
</head>
<body>
     <div class="restaurant-card">

        <div class="restaurant-name common-spacing">
            <h2>Spice Garden</h2>
        </div>

        <div class="cuisine common-spacing">
            Indian • Chinese • Fast Food
        </div>

        <div class="rating common-spacing">
            ⭐ 4.5 / 5
        </div>
</body>
</html>
